[project]
name = "agentcore-otel-app"
version = "0.1.0"
description = "AgentCore + Strands Graph + OTEL span dump experiment"
requires-python = ">=3.11"
dependencies = [
    "bedrock-agentcore==1.22.0",
    "strands-agents[otel]==1.52.0",
    "boto3==1.43.74",
    "aws-opentelemetry-distro==0.19.0",
]

[dependency-groups]
dev = [
    "bedrock-agentcore-starter-toolkit==0.3.11",
]

[tool.uv]
# 7日クールダウン: 2026-08-19より新しい公開物を除外 (実装日: 2026-08-25)
exclude-newer = "2026-08-19T00:00:00Z"
