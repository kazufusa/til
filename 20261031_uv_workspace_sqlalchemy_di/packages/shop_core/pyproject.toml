[project]
name = "shop-core"
version = "0.1.0"
description = "基盤チームが配る共有ライブラリ: ドメイン、リポジトリ、ユースケース、DB セッション、トランザクション"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "dependency-injector>=4.46",
    "uuid6>=2025.0.1",
    "boto3>=1.43.118",
    "anyio>=4.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_core"]
