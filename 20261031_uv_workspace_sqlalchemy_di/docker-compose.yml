x-env: &env
  DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 2s
      retries: 15

  # マイグレーションは基盤(shop_core)の持ち物で、本番では CI/CD が適用する。
  # これはパイプラインのローカル版で、`docker compose up` では起動しない。
  # profile のサービスは `docker compose build` では作り直されないので、マイグレーションを足したら先に
  #   docker compose --profile migrate build
  #   docker compose run --rm migrate
  # Postgres のテストは shop スキーマを消すので、開発用 DB で走らせたら当て直す
  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: packages/shop_core/Dockerfile
    environment: *env
    depends_on:
      db:
        condition: service_healthy

  app1:
    build:
      context: .
      dockerfile: app1/Dockerfile
    environment: *env
    ports: ["8001:8000"]
    depends_on:
      db:
        condition: service_healthy

  app2:
    build:
      context: .
      dockerfile: app2/Dockerfile
    environment:
      <<: *env
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-xoxb-dummy}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-dummy}
    ports: ["8002:8000"]
    depends_on:
      db:
        condition: service_healthy
