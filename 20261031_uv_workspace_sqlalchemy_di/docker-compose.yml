# DB のロールは 2 つに分ける。
#   shop      スキーマの持ち主。マイグレーション(migrate)だけが使う
#   shop_app  USAGE と DML だけ。アプリはこちらで接続し、起動時に assert_app_role が CREATE できないことを確かめる
# shop_app は docker/postgres-init/01_app_role.sql が初回起動で作り、権限はマイグレーション 0006 が付ける。
# このため、アプリより先に migrate を実行しておく(テーブルがないと起動時の検査が失敗して落ちる)。
x-env: &env
  S3_ENDPOINT_URL: http://s3:9090
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_REGION: ap-northeast-1
  ENV: local

x-owner-db: &owner_db
  DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop

x-app-db: &app_db
  DATABASE_URL: postgresql+psycopg://shop_app:shop_app@db:5432/shop

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - ./docker/postgres-init/01_app_role.sql:/docker-entrypoint-initdb.d/01_app_role.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 2s
      retries: 15

  # オブジェクトストレージ(S3 互換のモック)。initialBuckets のバケットを起動時に作る。
  # 本番の S3 と違い、認証情報は何でも通る。CopyObject で Content-Type を置き換えられない制約がある
  s3:
    image: adobe/s3mock:4.7.0
    environment:
      initialBuckets: shop-local-artifacts
    ports: ["9000:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/"]
      interval: 2s
      retries: 15

  # マイグレーションは基盤(shop_core)の持ち物で、本番では CI/CD が適用する。
  # これはパイプラインのローカル版で、`docker compose up` では起動しない。
  # profile のサービスは `docker compose build` では作り直されないので、マイグレーションを足したら先に
  #   docker compose --profile migrate build
  #   docker compose run --rm migrate
  # Postgres のテストは shop スキーマを消すので、開発用 DB で走らせたら当て直す
  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: packages/shop_core/Dockerfile
    environment:
      <<: [*env, *owner_db]
    depends_on:
      db:
        condition: service_healthy

  app1:
    build:
      context: .
      dockerfile: app1/Dockerfile
    environment:
      <<: [*env, *app_db]
    ports: ["8001:8000"]
    depends_on:
      db:
        condition: service_healthy

  app2:
    build:
      context: .
      dockerfile: app2/Dockerfile
    environment:
      <<: [*env, *app_db]
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-xoxb-dummy}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-dummy}
    ports: ["8002:8000"]
    depends_on:
      db:
        condition: service_healthy
