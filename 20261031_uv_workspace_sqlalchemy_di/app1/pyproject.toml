[project]
name = "app1"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "shop-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
shop-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app1"]

# ルート直下の app1/ ディレクトリが namespace package として src/app1 を隠すので、.pth 方式の editable にする
dev-mode-dirs = ["src"]
